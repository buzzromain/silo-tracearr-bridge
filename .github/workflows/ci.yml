name: CI
on: [push, pull_request]
jobs:
  native-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m py_compile tools/*.py
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/tracearr-bridge-linux-amd64 .
      - run: dist/tracearr-bridge-linux-amd64 manifest | jq -e --arg version "$(jq -r .version manifest.json)" '.version == $version and .presentation.supportUrl != null'
      - uses: actions/upload-artifact@v4
        with:
          name: tracearr-bridge-linux-amd64
          path: dist/tracearr-bridge-linux-amd64
